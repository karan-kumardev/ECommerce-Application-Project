<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">

            <a href="index.html" class="site-header__logo">My Shop name</a>

            <form action="" class="search-form">
                <input type="search" class="search-form__input" id="search-input" placeholder="Search Products" aria-label="Search products">
                <button type="submit" class="search-form__button">Search</button>
            </form>

            <nav class="site-header__nav">
                <a href="wishlist.html" class="nav-link">Wishlist</a>
                <a href="cart.html" class="nav-link">Cart
                    <span class="nav-link__badge" id="cart-count">0</span>
                </a>
                <a href="login.html" id="auth-link" class="nav-link">LogIn</a>
            </nav>

        </div>
    </header>

    <main class="admin-page">
        <div class="admin-layout">

            <aside class="admin-nav">
                <p class="admin-nav__title">Admin panel</p>
                <a href="admin-dashboard.html" class="admin-nav__link admin-nav__link--active">Dashboard</a>
                <a href="admin-products.html" class="admin-nav__link">Products</a>
                <a href="admin-orders.html" class="admin-nav__link">Orders</a>
                <a href="index.html" class="admin-nav__link admin-nav__link--back">&larr; Back to shop</a>
            </aside>

            <!-- hidden until js has checked that the user is an admin -->
            <section class="admin-main" id="admin-main" hidden>
                <h1 class="admin-main__title">Dashboard</h1>

                <div class="stat-grid" id="stat-grid"></div>

                <div class="admin-box">
                    <div class="admin-box__head">
                        <h2 class="admin-box__title">Recent orders</h2>
                        <a href="admin-orders.html" class="admin-box__link">View all</a>
                    </div>
                    <div class="table-wrap" id="recent-orders"></div>
                </div>

                <div class="admin-box">
                    <div class="admin-box__head">
                        <h2 class="admin-box__title">Low stock (5 or fewer left)</h2>
                        <a href="admin-products.html" class="admin-box__link">Manage products</a>
                    </div>
                    <div id="low-stock"></div>
                </div>

            </section>

        </div>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="../js/main.js" defer></script>
    <script src="../js/admin.js" defer></script>
    <script src="../js/admin-dashboard.js" defer></script>
</body>
</html>
