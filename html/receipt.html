<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order receipt</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">

            <a href="index.html" class="site-header__logo">My Shop name</a>

            <form action="" class="search-form">
                <input type="search" class="search-form__input" id="search-input" placeholder="Search Products" aria-label="Search products">
                <button type="submit" class="search-form__button">Search</button>
            </form>

            <nav class="site-header__nav">
                <a href="wishlist.html" class="nav-link">Wishlist</a>
                <a href="cart.html" class="nav-link">Cart
                    <span class="nav-link__badge" id="cart-count">0</span>
                </a>
                <a href="login.html" id="auth-link" class="nav-link">LogIn</a>
            </nav>

        </div>
    </header>

    <main class="checkout-page">

        <p class="checkout-message" id="receipt-message" hidden></p>

        <article class="receipt" id="receipt" hidden>
            <!-- filled with js -->
        </article>

    </main>

    <footer class="site-footer">
        <p class="site-footer__text">© 2026 ShopEase · A Web Engineering project</p>
    </footer>

    <script src="../js/lib/jspdf.umd.min.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/receipt.js" defer></script>
</body>
</html>
